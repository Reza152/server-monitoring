name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile docker_monitor.py
          python -m py_compile proxmox.py

      - name: Build Docker image
        run: |
          docker build -t server-monitoring-dashboard .

      - name: Start agent container
        run: |
          docker run -d \
            --name server-monitoring-agent-test \
            -p 5000:5000 \
            server-monitoring-dashboard \
            python app.py

      - name: Wait for agent
        run: |
          sleep 10

      - name: Test metrics endpoint
        run: |
          curl --fail http://localhost:5000/metrics

      - name: Stop test container
        if: always()
        run: |
          docker stop server-monitoring-agent-test || true
          docker rm server-monitoring-agent-test || true


  deploy:
    needs: test
    runs-on: self-hosted

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Deploy application
        run: |
          cd ~/projects/server-monitoring

          git pull origin main

          docker compose build

          docker compose up -d
