services:
  dashboard:
    build:
      context: .
      network: host

    image: server-monitoring-dashboard

    container_name: server-monitoring-dashboard

    network_mode: host

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  agent:
    build:
      context: .
      network: host

    image: server-monitoring-dashboard

    container_name: server-monitoring-agent

    network_mode: host

    restart: unless-stopped

    command: python app.py

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s